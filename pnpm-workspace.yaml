# Keep the lockfile free of explicit tarball URLs.
# pnpm 11.5+ verifies each recorded tarball URL against the active
# registry's metadata (supply-chain check). URLs pinned to a China
# mirror (npmmirror) make `pnpm install --frozen-lockfile` fail on
# CI, which resolves against registry.npmjs.org. Entries without an
# explicit URL are exempt: the URL is reconstructed from
# name+version+registry and is inherently bound.
lockfileIncludeTarballUrl: false

allowBuilds:
  esbuild: true
  sharp: true
