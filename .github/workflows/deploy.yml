# Build -> internal-link gate -> publish to GitHub Pages.
#
# The two jobs are intentionally separate: `build` runs the build plus the
# link gate; `deploy` only runs after `build` succeeds. If the gate fails,
# `deploy.needs` is unmet, so the live site keeps the last good version
# and is never overwritten with broken content.
#
# First-time setup is manual, once: Settings -> Pages -> Source = "GitHub Actions".
# Site URL is https://nostalume.github.io/comfyui-learning-guide/ -- the base path
# lives in astro.config.mjs, not here. Do not duplicate it in this file.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and upload site
        uses: withastro/action@v6
        with:
          node-version: 22
          package-manager: pnpm@11
          # Disable the Astro build cache: its cache dir is node_modules/.astro,
          # and this project's build entry (pnpm build -> scripts/clean.mjs) only
          # cleans dist/ by default, not that cache. A stale content cache leads
          # to Duplicate id errors and leftover old pages. CI wants reproducible,
          # not fast.
          cache: false

      - name: Gate - internal links
        run: pnpm run check:links

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
